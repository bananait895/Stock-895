<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock 895</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090D;--s1:#101015;--s2:#16161D;--b2:#1E1E27;
  --border:#2A2A35;--p:#7C3AED;--p2:#A855F7;
  --green:#22C55E;--yellow:#EAB308;--blue:#3B82F6;
  --muted:#52525B;--sub:#71717A;--text:#F4F4F5;
}
body{background:var(--bg);font-family:'Sarabun',sans-serif;color:var(--text);padding:18px 20px;font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.logo{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.tagline{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-top:2px}
.clock{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace}

.ctrl{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:180px;background:var(--s2);border:1px solid var(--border);border-radius:8px;
  padding:8px 13px;color:var(--text);font-family:'Sarabun',sans-serif;font-size:13px;outline:none}
.search:focus{border-color:var(--p)}
.search::placeholder{color:var(--muted)}
.frow{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
/* Style B — ตัวเลขบรรทัดล่าง */
.bf{background:var(--s2);border:1px solid var(--border);border-radius:6px;
  padding:4px 10px 5px;font-size:12px;font-weight:600;cursor:pointer;color:var(--sub);
  transition:.15s;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:0px}
.bf:hover{border-color:var(--p2);color:var(--text)}
.bf.on{background:var(--p);border-color:var(--p);color:#fff}
.bf .bn{font-size:10px;font-family:'IBM Plex Mono',monospace;font-weight:500;
  color:var(--muted);margin-top:1px;line-height:1}
.bf.on .bn{color:rgba(255,255,255,0.7)}
.rbar{font-size:11px;color:var(--muted);margin-bottom:8px;font-family:'IBM Plex Mono',monospace}
.wrap{background:var(--s1);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.thead{display:grid;grid-template-columns:28px 1fr 72px;
  background:var(--s2);padding:8px 14px;border-bottom:1px solid var(--border);gap:8px}
.thead span{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;text-align:center}
.thead span:nth-child(2){text-align:left}
.sortable{cursor:pointer}.sortable:hover{color:var(--text)}
.row{display:grid;grid-template-columns:28px 1fr 72px;
  padding:8px 14px;border-bottom:1px solid var(--b2);align-items:center;gap:8px;transition:.1s}
.row:last-child{border-bottom:none}
.row:hover{background:rgba(124,58,237,.08);cursor:pointer}
.swatch{width:26px;height:26px;border-radius:5px;border:1px solid rgba(255,255,255,.1);flex-shrink:0}
.model-txt{font-size:13px;font-weight:600;line-height:1.2}
.color-txt{font-size:11px;color:var(--sub);margin-top:3px;display:flex;align-items:center;gap:5px}
.color-dot{width:8px;height:8px;border-radius:50%;border:1px solid rgba(255,255,255,.15);flex-shrink:0;display:inline-block}
.barcode-txt{font-size:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-top:2px}
.price-txt{font-size:11px;font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--p2);margin-top:2px}
.qty{font-size:15px;font-weight:700;font-family:'IBM Plex Mono',monospace;text-align:center;border-radius:6px;padding:3px 0}
.qty.ok {color:#22C55E;background:rgba(34,197,94,.1)}
.qty.low{color:#EAB308;background:rgba(234,179,8,.1)}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:13px}
.row-info{cursor:pointer;min-width:0;overflow:hidden}
.row-info:hover .model-txt{color:var(--p2)}
.swatch:hover{opacity:.8;transform:scale(1.1)}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  background:var(--p);color:#fff;padding:9px 20px;border-radius:20px;
  font-size:13px;font-weight:600;opacity:0;pointer-events:none;
  transition:opacity .25s;z-index:9999;max-width:80vw;text-align:center}
.toast.show{opacity:1}

/* ── Firebase / Admin additions ── */
.edit-bar{display:none;position:sticky;bottom:0;background:var(--s2);border-top:1px solid var(--border);
  padding:12px 20px;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;z-index:50}
.edit-bar.show{display:flex}
.abtn{padding:9px 20px;border-radius:8px;border:none;font-family:'Sarabun',sans-serif;
  font-size:14px;font-weight:600;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px}
.abtn-save{background:#22C55E;color:#fff}.abtn-save:hover{background:#16a34a}
.abtn-save:disabled{opacity:.5;cursor:not-allowed}
.abtn-logout{background:var(--s1);color:var(--sub);border:1px solid var(--border)}
.abtn-logout:hover{color:#EF4444;border-color:#EF4444}
.save-info{font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
.lock-btn{font-size:11px;font-family:'IBM Plex Mono',monospace;padding:4px 12px;border-radius:20px;
  border:1px solid var(--border);background:var(--s2);color:var(--muted);cursor:pointer;transition:.15s}
.lock-btn:hover{border-color:var(--p);color:var(--text)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:999;display:flex;align-items:center;
  justify-content:center;opacity:0;pointer-events:none;transition:.2s}
.overlay.show{opacity:1;pointer-events:all}
.modal{background:var(--s2);border:1px solid var(--border);border-radius:16px;padding:28px 24px;width:300px;text-align:center}
.modal h2{font-size:18px;margin-bottom:6px}
.modal p{font-size:13px;color:var(--muted);margin-bottom:18px}
.modal input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;
  padding:10px 14px;color:var(--text);font-size:16px;text-align:center;letter-spacing:4px;
  font-family:'IBM Plex Mono',monospace;outline:none;margin-bottom:10px}
.modal input:focus{border-color:var(--p)}
.modal-err{font-size:12px;color:#EF4444;margin-bottom:10px;min-height:16px}
.mbtn{width:100%;padding:10px;border-radius:8px;border:none;font-family:'Sarabun',sans-serif;
  font-size:14px;font-weight:600;cursor:pointer;transition:.15s;margin-top:4px}
.mbtn-p{background:var(--p);color:#fff}.mbtn-p:hover{background:#6d28d9}
.mbtn-g{background:var(--s1);color:var(--sub);border:1px solid var(--border)}.mbtn-g:hover{color:var(--text)}
.qbtn{width:24px;height:24px;border-radius:6px;border:none;cursor:pointer;
  font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.qbtn.plus{background:rgba(34,197,94,.15);color:#22C55E}.qbtn.plus:hover{background:#22C55E;color:#fff}
.qbtn.minus{background:rgba(239,68,68,.12);color:#EF4444}.qbtn.minus:hover{background:#EF4444;color:#fff}
.qty-cell{display:flex;align-items:center;justify-content:center;gap:4px}
.changed{outline:1px solid #EAB308}
.sync{display:flex;align-items:center;gap:6px;font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--muted)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#52525B;transition:.3s}
.abtn-add{background:var(--blue);color:#fff}.abtn-add:hover{background:#2563eb}

.hist-btn{font-size:11px;font-family:'IBM Plex Mono',monospace;padding:4px 12px;border-radius:20px;
  border:1px solid var(--border);background:var(--s2);color:var(--muted);cursor:pointer;transition:.15s;position:relative}
.hist-btn:hover{border-color:#22C55E;color:#22C55E}
.hist-btn.has-hist{border-color:#22C55E;color:#22C55E}
.hist-badge{position:absolute;top:-5px;right:-5px;background:#22C55E;color:#fff;font-size:9px;
  font-weight:700;border-radius:8px;padding:1px 5px;min-width:16px;text-align:center;display:none}
.hist-btn.has-hist .hist-badge{display:block}
.hist-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.2s;padding:16px}
.hist-overlay.show{opacity:1;pointer-events:all}
.hist-panel{background:var(--s2);border:1px solid var(--border);border-radius:16px;width:100%;max-width:480px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;transform:scale(.96) translateY(8px);transition:.2s}
.hist-overlay.show .hist-panel{transform:scale(1) translateY(0)}
.hist-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--s1);border-bottom:1px solid var(--border);flex-shrink:0}
.hist-title{font-size:15px;font-weight:700;color:var(--text)}
.hist-header-right{display:flex;align-items:center;gap:12px}
.hist-close{width:28px;height:28px;border-radius:50%;border:none;background:var(--b2);color:var(--muted);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;line-height:1}
.hist-close:hover{background:var(--border);color:var(--text)}
.hist-last{font-size:10px;color:#22C55E;font-family:'IBM Plex Mono',monospace;padding:8px 20px;background:rgba(34,197,94,.06);border-bottom:1px solid var(--border);flex-shrink:0}
.hist-list{overflow-y:auto;flex:1}
.hist-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--b2);font-size:13px}
.hist-item:last-child{border-bottom:none}
.hist-type{font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;white-space:nowrap}
.ht-edit{background:rgba(59,130,246,.15);color:#60A5FA}
.ht-add{background:rgba(34,197,94,.15);color:#22C55E}
.ht-del{background:rgba(239,68,68,.12);color:#EF4444}
.hist-name{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-time{font-size:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace;white-space:nowrap}
.hist-empty{padding:40px;text-align:center;color:var(--muted);font-size:13px}

/* ── Mobile Responsive ── */
@media (max-width: 600px) {
  body { padding: 8px 10px; font-size: 13px; }

  /* Top bar */
  .top { flex-wrap: wrap; gap: 4px; margin-bottom: 8px; align-items: flex-start; }
  .top > div:first-child { flex: 1; min-width: 0; }
  .logo { font-size: 14px; }
  .tagline { font-size: 10px; }
  .top-right { gap: 5px; }
  #clk { font-size: 9px; }
  .hist-btn, .lock-btn { font-size: 10px; padding: 4px 8px; border-radius: 14px; }
  .sync { font-size: 10px; gap: 4px; }
  .sync-dot { width: 6px; height: 6px; }

  /* Search */
  .search { font-size: 13px; padding: 7px 11px; }
  .ctrl { margin-bottom: 5px; }

  /* Filter */
  .bf { padding: 4px 8px 5px; font-size: 11px; border-radius: 6px; }
  .bf .bn { font-size: 9px; }
  .frow { gap: 4px; margin-bottom: 5px; }
  .rbar { font-size: 10px; margin-bottom: 5px; }

  /* Table */
  .thead { padding: 6px 10px; gap: 6px; }
  .thead span { font-size: 9px; }
  .row { padding: 7px 10px; gap: 6px; grid-template-columns: 22px 1fr 60px; }
  .swatch { width: 22px; height: 22px; border-radius: 4px; }
  .model-txt { font-size: 12px; }
  .color-txt { font-size: 10px; margin-top: 1px; gap: 4px; }
  .color-dot { width: 7px; height: 7px; }
  .barcode-txt { font-size: 9px; margin-top: 1px; }
  .price-txt { font-size: 10px; margin-top: 1px; }

  /* Qty cell */
  .qbtn { width: 28px; height: 28px; font-size: 15px; border-radius: 6px; }
  .qty { font-size: 14px; min-width: 20px; }
  .qty-cell { gap: 3px; }

  /* Edit bar */
  .edit-bar { padding: 8px 10px; gap: 6px; flex-wrap: wrap; }
  .save-info { width: 100%; text-align: center; font-size: 10px; }
  .abtn { padding: 8px 12px; font-size: 13px; flex: 1; justify-content: center; }
  .abtn-save { order: -1; }

  /* Modal */
  .modal { width: calc(100vw - 24px) !important; max-width: 400px; padding: 20px 16px; }
  .overlay { align-items: flex-end; }
  .overlay .modal {
    border-radius: 14px 14px 0 0 !important;
    max-height: 88vh;
    overflow-y: auto;
    padding-bottom: 24px !important;
  }

  /* Wrap */
  .wrap { border-radius: 10px; }
}

</style>
</head>
<body>
<div class="top">
  <div>
    <div class="logo">🍌 Stock 895</div>
    <div class="tagline" id="tagline"></div>
  </div>
  <div class="top-right">
    <div class="sync"><div class="sync-dot" id="syncDot"></div><span id="syncTxt">กำลังเชื่อมต่อ...</span></div>
    <button class="hist-btn" id="histBtn" onclick="toggleHistory()">📋 ประวัติ<span class="hist-badge" id="histBadge">0</span></button>
    <button class="lock-btn" id="lockBtn" onclick="openModal()">🔒 แก้ไขสต็อก</button>
    <div id="clk" style="text-align:right;line-height:1.3"></div>
  </div>
</div>



<div class="ctrl">
  <input class="search" id="q" placeholder="🔍  ค้นหา รุ่น · สี · เลข Product" oninput="render()">
</div>
<div class="frow" id="filterRow"></div>
<div class="rbar" id="rbar"></div>

<div class="wrap">
  <div class="thead">
    <span></span>
    <span>รุ่น / สี / Product No. / ราคา</span>
    <span class="sortable" onclick="doSort('qty')">จำนวน ↕</span>
  </div>
  <div id="list"></div>
</div>

<div class="hist-overlay" id="histOverlay" onclick="handleOverlayClick(event)">
  <div class="hist-panel" id="histPanel">
    <div class="hist-header">
      <span class="hist-title">📋 ประวัติการแก้ไข</span>
      <div class="hist-header-right">
        <button class="hist-close" onclick="toggleHistory()">✕</button>
      </div>
    </div>
    <div class="hist-last" id="histLastTime" style="display:none"></div>
    <div class="hist-list" id="histList"><div class="hist-empty">ยังไม่มีประวัติการแก้ไข</div></div>
  </div>
</div>

<!-- Password Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div style="font-size:28px;margin-bottom:10px">🔐</div>
    <h2>Admin Login</h2>
    <p>ใส่รหัสผ่านเพื่อแก้ไขสต็อก</p>
    <input type="password" id="pwInput" placeholder="••••••" maxlength="20" onkeydown="if(event.key==='Enter')checkPw()">
    <div class="modal-err" id="pwErr"></div>
    <button class="mbtn mbtn-p" onclick="checkPw()">เข้าสู่ระบบ</button>
    <button class="mbtn mbtn-g" onclick="closeModal()">ยกเลิก</button>
  </div>
</div>
<!-- Edit Bar -->
<div class="edit-bar" id="editBar">
  <span class="save-info" id="saveInfo">มีการเปลี่ยนแปลง 0 รายการ</span>
  <button class="abtn abtn-add" onclick="openAddModal()">➕ เพิ่ม Product</button>
  <button class="abtn abtn-logout" onclick="logout()">🔒 Logout</button>
  <button class="abtn abtn-save" id="saveBtn" onclick="saveAll()" disabled>💾 บันทึก</button>
</div>

<!-- Add Product Modal -->
<div class="overlay" id="addOverlay">
  <div class="modal" style="width:360px;text-align:left">
    <div style="font-size:24px;margin-bottom:8px;text-align:center">➕</div>
    <h2 style="text-align:center;margin-bottom:16px">เพิ่ม Product ใหม่</h2>
    <div style="display:grid;gap:10px">
      <div>
        <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">Barcode / Product No. *</label>
        <input class="search" id="ap_barcode" placeholder="เช่น 195949036071" style="width:100%">
      </div>
      <div>
        <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">ชื่อสินค้า (Name) *</label>
        <input class="search" id="ap_name" placeholder="เช่น Apple iPhone 16 128GB Black" style="width:100%">
      </div>
      <div>
        <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">รุ่น (Model)</label>
        <input class="search" id="ap_model" placeholder="เช่น Apple iPhone 16 128GB" style="width:100%">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div>
          <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">สี (Color)</label>
          <input class="search" id="ap_color" placeholder="เช่น Black" style="width:100%">
        </div>
        <div>
          <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">ความจุ (Storage)</label>
          <input class="search" id="ap_storage" placeholder="เช่น 128GB" style="width:100%">
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div>
          <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">ราคา Set Price (฿) *</label>
          <input class="search" id="ap_price" type="number" placeholder="เช่น 26500" style="width:100%">
        </div>
        <div>
          <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">จำนวน (Qty) *</label>
          <input class="search" id="ap_qty" type="number" placeholder="เช่น 1" min="0" style="width:100%">
        </div>
      </div>
      <div>
        <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">หมวดหมู่ (Category) *</label>
        <select class="search" id="ap_category" style="width:100%">
          <option value="">-- เลือก --</option>
          <option value="iPhone">iPhone</option>
          <option value="iPad">iPad</option>
          <option value="Apple Watch">Apple Watch</option>
          <option value="Smartphone">Smartphone</option>
          <option value="Tablet">Tablet</option>
          <option value="Notebook">Notebook</option>
        </select>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div>
          <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">แบรนด์ (Brand)</label>
          <input class="search" id="ap_brand" placeholder="เช่น Apple" style="width:100%">
        </div>
        <div>
          <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">สี HEX (ไม่ต้อง #)</label>
          <input class="search" id="ap_hex" placeholder="เช่น 111111" maxlength="6" style="width:100%">
        </div>
      </div>
      <div class="modal-err" id="apErr"></div>
      <button class="mbtn mbtn-p" onclick="submitAddProduct()">✅ เพิ่มสินค้า</button>
      <button class="mbtn mbtn-g" onclick="closeAddModal()">ยกเลิก</button>
    </div>
  </div>
</div>

const BRANDS = ["Acer","Apple","Asus","HP","Honor","Infinix","Iqoo","Lenovo","Oppo","Realme","Samsung","Vivo","Xiaomi","Zte"];
const CATS = ["iPhone", "iPad", "Apple Watch", "Smartphone", "Tablet", "Notebook"];

const totalQty = DATA.reduce((a,d)=>a+d.qty,0);
document.getElementById("tagline").textContent = DATA.length+" รายการ · "+totalQty+" ชิ้น · "+BRANDS.length+" แบรนด์";
let aF="all", aFtype="all", aS="all", sK=null, sD=1;
let isAdmin=false, changes={}, _fbDb=null, _fbRef=null, _fbUpdate=null;

const filterRow = document.getElementById("filterRow");
const SM_BRANDS = [...new Set(DATA.filter(d=>d.category==='Smartphone').map(d=>d.brand).filter(Boolean))].sort();
const filterItems = [
  {id:"all",         label:"ทั้งหมด",     type:"all"},
  {id:"iPhone",      label:"iPhone",      type:"cat"},
  {id:"iPad",        label:"iPad",        type:"cat"},
  {id:"Apple Watch", label:"Apple Watch", type:"cat"},
  {id:"Tablet",      label:"Tablet",      type:"cat"},
  {id:"Notebook",    label:"Notebook",    type:"cat"},
  ...SM_BRANDS.map(b=>({id:b, label:b, type:"brand"})),
];

filterItems.forEach(f=>{
  const btn  = document.createElement("button");
  btn.className = "bf" + (f.id==="all" ? " on" : "");

  // นับ qty
  let count;
  if(f.type==="all")      count = DATA.reduce((a,d)=>a+d.qty,0);
  else if(f.type==="cat") count = DATA.filter(d=>d.category===f.id).reduce((a,d)=>a+d.qty,0);
  else                    count = DATA.filter(d=>d.brand===f.id).reduce((a,d)=>a+d.qty,0);

  btn.innerHTML = `<span>${f.label}</span><span class="bn">${count}</span>`;
  btn.onclick = ()=>{
    filterRow.querySelectorAll(".bf").forEach(x=>x.classList.remove("on"));
    btn.classList.add("on");
    aF=f.id; aFtype=f.type;
    render();
  };
  filterRow.appendChild(btn);
});



function doSort(k){ if(sK===k) sD*=-1; else{sK=k;sD=1;} render(); }
function qc(v){ return v<=2?"low":"ok"; }

function render(){
  const q=document.getElementById("q").value.toLowerCase();
  let rows=DATA.filter(d=>{
    if(aF!=="all"){
      if(aFtype==="cat"   && d.category!==aF) return false;
      if(aFtype==="brand" && d.brand!==aF)    return false;
    }
    if(!isAdmin && d.qty===0) return false;
    if(aS==="low" && !(d.qty>=1&&d.qty<=2)) return false;
    if(aS==="ok"  && d.qty<3) return false;
    if(q && !(d.name.toLowerCase().includes(q)||d.barcode.includes(q))) return false;
    return true;
  });
  if(sK==="qty") rows.sort((a,b)=>(a.qty-b.qty)*sD);
  else rows.sort((a,b)=>{ const pd=a.set_price-b.set_price; return pd!==0?pd:a.model.localeCompare(b.model); });

  document.getElementById("rbar").textContent="แสดง "+rows.length+" จาก "+DATA.length+" รายการ";
  const el=document.getElementById("list");
  if(!rows.length){el.innerHTML='<div class="empty">ไม่พบสินค้า</div>';return;}
  el.innerHTML=rows.map(d=>{
    const q='https://www.google.com/search?q='+encodeURIComponent(d.name.replace(/^BS@\s*/i,'').replace(/\s*F\+\s*$/i,'').trim())+'&udm=2';
    return `<div class="row">
      <a class="swatch" href="${q}" target="_blank" rel="noopener" style="background:#${d.hex};display:block;text-decoration:none"></a>
      <div class="row-info" onclick="copyName('${d.barcode}')">
        <div class="model-txt">${d.model}</div>
        ${d.color ? `<div class="color-txt"><span class="color-dot" style="background:#${d.hex}"></span>${d.color}</div>` : ''}
        <div class="barcode-txt">${d.barcode}</div>
        <div class="price-txt">${d.set_price?d.set_price.toLocaleString()+'฿':'—'}</div>
      </div>
      ${isAdmin
        ? `<div class="qty-cell">
             <button class="qbtn minus" onclick="changeQty('${d.barcode.replace(/'/g,"\\'")}', -1)">−</button>
             <div class="qty ${qc(d.qty)}${changes[d.barcode]!==undefined?' changed':''}">${d.qty}${changes[d.barcode]!==undefined?' *':''}</div>
             <button class="qbtn plus" onclick="changeQty('${d.barcode.replace(/'/g,"\\'")}', 1)">+</button>
           </div>`
        : `<div class="qty ${qc(d.qty)}">${d.qty}</div>`
      }
    </div>`;
  }).join("");
}

function copyName(name) {
  const t = document.getElementById('toast');
  const show = (msg) => {
    t.textContent = '📋 ' + msg;
    t.classList.add('show');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
  };
  if (navigator.clipboard) {
    navigator.clipboard.writeText(name).then(()=>show(name)).catch(()=>fallback(name,show));
  } else { fallback(name,show); }
}
function fallback(name, show) {
  const ta = document.createElement('textarea');
  ta.value = name; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); show(name); } catch(e) { show('ไม่สามารถคัดลอกได้'); }
  document.body.removeChild(ta);
}

    const item=DATA.find(d=>d.barcode===bc);

  });

async function saveAll(){
  // รอ Firebase พร้อม (max 5s)
  if(!window._fbDb || !window._fbRef || !window._fbUpdate) {
    let wait = 0;
    await new Promise(res => {
      const t = setInterval(()=>{ wait+=200;
        if(window._fbDb && window._fbRef && window._fbUpdate){ clearInterval(t); res(); }
        else if(wait>=5000){ clearInterval(t); res(); }
      }, 200);
    });
  }
  if(!window._fbUpdate||!window._fbRef||!window._fbDb){showToast('ยังไม่ได้เชื่อมต่อ Firebase','err');return;}
  _fbDb=window._fbDb; _fbRef=window._fbRef; _fbUpdate=window._fbUpdate;
  if(Object.keys(changes).length===0) return;
  document.getElementById('saveBtn').disabled=true;
  document.getElementById('saveBtn').textContent='⏳ กำลังบันทึก...';
  try{
    await _fbUpdate(_fbRef(_fbDb,'stock'), changes);
    DATA.forEach(d=>{if(d._orig!==undefined)delete d._orig;});
    showToast('💾 บันทึกสำเร็จ '+Object.keys(changes).length+' รายการ');
    changes={}; document.getElementById('saveBtn').textContent='💾 บันทึก'; logout();
  }catch(e){
    showToast('❌ บันทึกไม่สำเร็จ: '+e.message,'err');
    document.getElementById('saveBtn').disabled=false;
    document.getElementById('saveBtn').textContent='💾 บันทึก';
  }
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = type==='err' ? '#EF4444' : 'var(--p)';
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2500);
}

function changeQty(barcode, delta) {
  const item = DATA.find(d=>d.barcode===barcode);
  if(!item) return;
  const newQty = Math.max(0, item.qty + delta);
  if(item._orig===undefined) item._orig = item.qty; // บันทึกค่าเดิม
  item.qty = newQty;
  changes[barcode] = newQty;
  const hasChanges = Object.keys(changes).length > 0;
  document.getElementById('saveBtn').disabled = !hasChanges;
  document.getElementById('saveInfo').textContent = 'มีการเปลี่ยนแปลง '+Object.keys(changes).length+' รายการ';
  addHistory('edit', item.name, 'จำนวน → '+newQty);
  render();
  updateKpi();
}

function updateKpi() {
  const total = DATA.reduce((a,d)=>a+d.qty,0);
  document.getElementById('tagline').textContent = DATA.length+' รายการ · '+total+' ชิ้น · '+BRANDS.length+' แบรนด์';
}

function submitAddProduct(){
  const barcode = document.getElementById('ap_barcode').value.trim();
  const name    = document.getElementById('ap_name').value.trim();
  const price   = parseInt(document.getElementById('ap_price').value)||0;
  const qty     = parseInt(document.getElementById('ap_qty').value)||0;
  const cat     = document.getElementById('ap_category').value;
  if(!barcode||!name||!cat){document.getElementById('apErr').textContent='กรุณากรอก Barcode, ชื่อสินค้า และ หมวดหมู่';return;}
  if(DATA.find(d=>d.barcode===barcode)){document.getElementById('apErr').textContent='Barcode นี้มีอยู่แล้วในระบบ';return;}
  const hex = (document.getElementById('ap_hex').value.trim().replace('#','')||'808080').padEnd(6,'0').substring(0,6);
  const fg  = parseInt(hex,16)>0x888888 ? '111111' : 'F5F5F5';
  const newItem = {
    barcode, name,
    model:   document.getElementById('ap_model').value.trim() || name,
    color:   document.getElementById('ap_color').value.trim(),
    storage: document.getElementById('ap_storage').value.trim(),
    qty, set_price: price,
    brand:   document.getElementById('ap_brand').value.trim(),
    category: cat, hex, fg
  };
  DATA.push(newItem);
  changes[barcode] = qty;
  document.getElementById('saveBtn').disabled = false;
  document.getElementById('saveInfo').textContent = 'มีการเปลี่ยนแปลง '+Object.keys(changes).length+' รายการ';
  closeAddModal();
  addHistory('add', name, 'หมวด: '+cat);
  render(); updateKpi(); buildFilters();
  showToast('✅ เพิ่ม '+name+' แล้ว');
}


// ─── HISTORY MODULE ───────────────────────────────────
var HISTORY = [];
try { HISTORY = JSON.parse(localStorage.getItem('stock895_hist') || '[]'); } catch(e){ HISTORY=[]; }
var histOpen = false;

function saveHistory(){
  try { localStorage.setItem('stock895_hist', JSON.stringify(HISTORY)); } catch(e){}
}

function fmtDate(d){
  return d.toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'numeric'})
    +' '+d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

function addHistory(type, name, detail){
  var now = new Date();
  HISTORY.unshift({type:type, name:name, detail:detail||'', date:fmtDate(now), ts:now.getTime()});
  saveHistory();
  renderHistory();
  setLastUpdated(now);
  updateHistBadge();
  if(!histOpen){
    histOpen=true;
    document.getElementById('histOverlay').classList.add('show');
    document.body.style.overflow='hidden';
  }
}

function setLastUpdated(d){
  var dateStr = d.toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'numeric'});
  var timeStr = d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('clk').innerHTML =
    '<div style="font-size:10px;color:var(--muted)">อัพเดทล่าสุด</div>'+
    '<div style="font-size:13px;font-weight:700;color:#22C55E">'+dateStr+'</div>'+
    '<div style="font-size:15px;font-weight:700;color:#22C55E;letter-spacing:.5px">'+timeStr+'</div>';
  var lt = document.getElementById('histLastTime');
  if(lt) lt.textContent = 'อัพเดทล่าสุด: '+dateStr+' '+timeStr;
}

function updateHistBadge(){
  var btn = document.getElementById('histBtn');
  var badge = document.getElementById('histBadge');
  if(!btn||!badge) return;
  if(HISTORY.length > 0){
    btn.classList.add('has-hist');
    badge.textContent = HISTORY.length > 99 ? '99+' : HISTORY.length;
    badge.style.display = 'block';
  } else {
    btn.classList.remove('has-hist');
    badge.style.display = 'none';
  }
}

function toggleHistory(){
  histOpen = !histOpen;
  document.getElementById('histOverlay').classList.toggle('show', histOpen);
  document.body.style.overflow = histOpen ? 'hidden' : '';
}
function handleOverlayClick(e){
  if(e.target === document.getElementById('histOverlay')) toggleHistory();
}

function renderHistory(){
  var el = document.getElementById('histList');
  var lt = document.getElementById('histLastTime');
  if(!el) return;
  if(!HISTORY.length){
    el.innerHTML = '<div class="hist-empty">ยังไม่มีประวัติการแก้ไข</div>';
    if(lt){ lt.textContent=''; lt.style.display='none'; }
    return;
  }
  if(lt){ lt.textContent='🕐 อัพเดทล่าสุด: '+HISTORY[0].date; lt.style.display='block'; }
  el.innerHTML = HISTORY.map(function(h){
    var cls = h.type==='add' ? 'ht-add' : h.type==='del' ? 'ht-del' : 'ht-edit';
    var icon = h.type==='add' ? '➕ เพิ่ม' : h.type==='del' ? '➖ ลบ' : '✏️ แก้ไข';
    return '<div class="hist-item">'
      +'<span class="hist-type '+cls+'">'+icon+'</span>'
      +'<span class="hist-name" title="'+h.name+'">'+h.name+(h.detail?' — '+h.detail:'')+'</span>'
      +'<span class="hist-time">'+h.date+'</span>'
      +'</div>';
  }).join('');
}


document.addEventListener('DOMContentLoaded', function(){
  updateHistBadge();
  renderHistory();
  if(HISTORY.length) setLastUpdated(new Date(HISTORY[0].ts));
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && histOpen) toggleHistory();
});

function buildFilters() {
  document.querySelectorAll('.bf').forEach(btn => {
    const f = filterItems.find(f=>f.label===btn.querySelector('span:first-child').textContent);
    if(!f) return;
    let rows = isAdmin ? DATA : DATA.filter(d=>d.qty>0);
    let count;
    if(f.type==='all')      count = rows.reduce((a,d)=>a+d.qty,0);
    else if(f.type==='cat') count = rows.filter(d=>d.category===f.id).reduce((a,d)=>a+d.qty,0);
    else                    count = rows.filter(d=>d.brand===f.id&&d.category==='Smartphone').reduce((a,d)=>a+d.qty,0);
    const bn = btn.querySelector('.bn');
    if(bn) bn.textContent = count;
  });
}
