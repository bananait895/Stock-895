<!-- EARLY ERROR CATCH: must run before any module script -->
<script>
(function(){
  window.__errors = [];
  window.addEventListener('error', function(e){
    window.__errors.push({
      message: e.message || 'Unknown error',
      file: e.filename || '?',
      line: e.lineno,
      col: e.colno,
      stack: e.error?.stack || ''
    });
    console.error('[EARLY ERROR]', e.message || '(empty)', 'at', e.filename || '(no file)', ':', e.lineno || 0, e.error);

    // Skip empty/CORS-masked "Script error." — they're noise we can't act on
    if(!e.message || e.message === 'Script error.' || e.message === '') return;

    showFatalError(e.message, e.filename || '?');
  }, true);

  window.addEventListener('unhandledrejection', function(e){
    const r = e.reason;
    const msg = r?.message || String(r);
    console.error('[PROMISE ERROR]', msg);
    if(!msg || msg === 'undefined') return;
    showFatalError(msg, 'promise rejection');
  });

  function showFatalError(msg, where){
    if(window.__appReady) return;
    if(document.getElementById('__fatalBox')) return;
    const div = document.createElement('div');
    div.id = '__fatalBox';
    div.style.cssText = 'position:fixed;inset:0;background:#09090D;color:#F4F4F5;'+
      'font-family:sans-serif;padding:20px;z-index:99999;overflow:auto;line-height:1.5';
    let extraHelp = '';
    if(location.protocol === 'file:'){
      extraHelp = '<div style="background:#7C3AED20;border:1px solid #7C3AED;padding:14px;border-radius:8px;margin-top:14px">'+
        '<b>⚠️ ตรวจพบว่าเปิดไฟล์ผ่าน file://</b><br><br>'+
        'ไฟล์นี้ใช้ Firebase + ES modules ซึ่ง<b>ทำงานไม่ได้</b>เมื่อดับเบิลคลิกเปิดตรงๆ<br><br>'+
        'ต้องเปิดผ่าน HTTP server เช่น:<br>'+
        '<b>1. ง่ายสุด:</b> ลาก folder ที่มีไฟล์เข้า <a href="https://app.netlify.com/drop" target="_blank" style="color:#A855F7">app.netlify.com/drop</a><br>'+
        '<b>2. ใช้ VS Code:</b> ติดตั้ง "Live Server" extension แล้วคลิกขวา → Open with Live Server<br>'+
        '<b>3. ใช้ Python:</b> ใน terminal cd ไปที่ folder แล้วพิมพ์ <code style="background:#000;padding:2px 6px;border-radius:3px">python -m http.server 8000</code> แล้วเปิด <code>http://localhost:8000</code></div>';
    }
    div.innerHTML =
      '<div style="max-width:600px;margin:0 auto">'+
      '<h1 style="color:#EF4444;font-size:18px;margin-bottom:10px">⚠️ เกิดข้อผิดพลาด</h1>'+
      '<div style="background:#16161D;border:1px solid #2A2A35;padding:14px;border-radius:8px;'+
        'font-family:monospace;font-size:12px;color:#EAB308;word-break:break-all">'+
        '<b>Error:</b> '+escapeHtml(msg)+'<br>'+
        '<b>ที่:</b> '+escapeHtml(where)+
      '</div>'+
      extraHelp+
      '<div style="margin-top:18px"><button onclick="location.reload()" '+
        'style="background:#7C3AED;color:#fff;border:none;padding:10px 22px;border-radius:8px;'+
        'cursor:pointer;font-size:14px">↻ โหลดใหม่</button></div>'+
      '</div>';
    document.body.appendChild(div);
  }
  function escapeHtml(s){return String(s).replace(/[<>&]/g, m=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[m]));}
  window.__showFatalError = showFatalError;
})();
</script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#09090D;--s1:#101015;--s2:#16161D;--b2:#1E1E27;
  --border:#2A2A35;--p:#7C3AED;--p2:#A855F7;
  --green:#22C55E;--yellow:#EAB308;--red:#EF4444;--blue:#3B82F6;
  --muted:#52525B;--sub:#71717A;--text:#F4F4F5;
}
html,body{background:var(--bg);font-family:'Sarabun',sans-serif;color:var(--text);
  font-size:14px;min-height:100vh;overflow-x:hidden}
body{padding:14px 14px calc(80px + env(safe-area-inset-bottom,0px));padding-top:max(14px, env(safe-area-inset-top,0px))}

/* Header */
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.logo{font-size:18px;font-weight:700;display:flex;align-items:center;gap:6px}
.tagline{font-size:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-top:2px}
.head-r{display:flex;align-items:center;gap:8px}
.sync-pill{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--sub);
  background:var(--s2);border:1px solid var(--border);padding:5px 10px;border-radius:20px;
  font-family:'IBM Plex Mono',monospace}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}

/* KPI strip */
.kpi-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.kpi .v{font-size:18px;font-weight:700;font-family:'IBM Plex Mono',monospace}
.kpi .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:1px}
.kpi.green .v{color:var(--green)}
.kpi.yellow .v{color:var(--yellow)}
.kpi.red .v{color:var(--red)}

/* Search */
.search-row{display:flex;gap:8px;margin-bottom:10px}
.search{flex:1;background:var(--s2);border:1px solid var(--border);border-radius:10px;
  padding:11px 14px;color:var(--text);font-family:inherit;font-size:14px;outline:none}
.search:focus{border-color:var(--p)}
.search::placeholder{color:var(--muted)}
.scan-btn{width:46px;height:46px;background:var(--p);border:none;border-radius:10px;
  color:#fff;font-size:22px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.scan-btn:hover{background:#6d28d9}
.scan-btn:disabled{opacity:.5}

/* Filter chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--s2);border:1px solid var(--border);border-radius:18px;padding:6px 12px;
  font-size:12px;font-weight:600;color:var(--sub);cursor:pointer;white-space:nowrap;
  display:flex;align-items:center;gap:5px;flex-shrink:0;transition:.15s}
.chip:hover{color:var(--text);border-color:var(--p2)}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.chip .n{font-size:10px;font-family:'IBM Plex Mono',monospace;opacity:.7}

/* Sort/View row */
.sort-row{display:flex;gap:6px;margin-bottom:10px;align-items:center;font-size:11px;color:var(--muted);
  font-family:'IBM Plex Mono',monospace}
.sort-btn{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:5px 10px;
  font-size:11px;color:var(--sub);cursor:pointer;font-family:inherit}
.sort-btn.on{color:var(--p2);border-color:var(--p)}
.view-toggle{margin-left:auto;display:flex;background:var(--s2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.view-toggle button{background:none;border:none;color:var(--sub);padding:5px 10px;cursor:pointer;font-size:13px}
.view-toggle button.on{background:var(--p);color:#fff}

/* List view */
.list-wrap{background:var(--s1);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:36px 1fr auto;gap:10px;padding:10px 12px;
  border-bottom:1px solid var(--b2);align-items:center;transition:.1s}
.row:last-child{border-bottom:none}
.row:active{background:rgba(124,58,237,.1)}
.row.flash{animation:flash .8s ease}
@keyframes flash{0%{background:rgba(34,197,94,.3)}100%{background:transparent}}
.sw{width:32px;height:32px;border-radius:6px;border:1px solid rgba(255,255,255,.1);flex-shrink:0}
.info{min-width:0;overflow:hidden}
.info .name{font-size:13px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.info .meta{font-size:10px;color:var(--sub);margin-top:2px;font-family:'IBM Plex Mono',monospace}
.info .color-tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--sub);margin-top:2px}
.cdot{width:7px;height:7px;border-radius:50%;border:1px solid rgba(255,255,255,.15)}
.info .price{font-size:11px;color:var(--p2);font-weight:600;font-family:'IBM Plex Mono',monospace;margin-top:2px}
.qty-area{display:flex;align-items:center;gap:6px}
.qbtn{width:30px;height:30px;border-radius:7px;border:none;font-size:18px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center}
.qbtn.plus{background:rgba(34,197,94,.15);color:var(--green)}
.qbtn.plus:active{background:var(--green);color:#fff}
.qbtn.minus{background:rgba(239,68,68,.12);color:var(--red)}
.qbtn.minus:active{background:var(--red);color:#fff}
.qbtn:disabled{opacity:.3;cursor:not-allowed}
.qty{font-size:18px;font-weight:700;font-family:'IBM Plex Mono',monospace;min-width:30px;text-align:center;
  padding:4px 7px;border-radius:6px}
.qty.ok{color:var(--green);background:rgba(34,197,94,.1)}
.qty.low{color:var(--yellow);background:rgba(234,179,8,.12)}
.qty.zero{color:var(--red);background:rgba(239,68,68,.12)}

/* Grid view */
.grid-wrap{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:540px){.grid-wrap{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:10px;
  display:flex;flex-direction:column;gap:7px;transition:.1s}
.card:active{transform:scale(.98)}
.card-sw{width:100%;aspect-ratio:1.4;border-radius:8px;border:1px solid rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center}
.card-name{font-size:12px;font-weight:600;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{font-size:10px;color:var(--sub);font-family:'IBM Plex Mono',monospace}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.card-price{font-size:11px;color:var(--p2);font-weight:600;font-family:'IBM Plex Mono',monospace}

/* Empty */
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}
.empty .ico{font-size:36px;margin-bottom:10px;opacity:.5}

/* Bottom bar */
.botbar{position:fixed;bottom:0;left:0;right:0;background:var(--s1);border-top:1px solid var(--border);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;
  align-items:center;justify-content:space-between;z-index:100}
.botbar .bb-info{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;line-height:1.3}
.botbar .bb-actions{display:flex;gap:6px}
.botbar .abtn{padding:8px 14px;border-radius:8px;border:none;font-family:inherit;
  font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px}
.abtn-save{background:var(--green);color:#fff}.abtn-save:disabled{opacity:.4}
.abtn-cancel{background:var(--s2);color:var(--sub);border:1px solid var(--border)}
.abtn-admin{background:var(--s2);color:var(--sub);border:1px solid var(--border)}

/* Scanner Modal */
.scan-overlay{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:9000;display:none;
  flex-direction:column;align-items:center;justify-content:center;padding:20px}
.scan-overlay.show{display:flex}
.scan-overlay h3{color:#fff;margin-bottom:14px;font-size:16px}
.scan-overlay #reader{width:100%;max-width:380px;border-radius:14px;overflow:hidden}
.scan-overlay #reader video{border-radius:14px}
.scan-status{margin-top:14px;color:var(--sub);font-size:12px;text-align:center;
  font-family:'IBM Plex Mono',monospace;min-height:18px}
.scan-status.found{color:var(--green)}.scan-status.err{color:var(--red)}
.scan-close{margin-top:18px;background:var(--s1);color:var(--text);border:1px solid var(--border);
  padding:10px 24px;border-radius:24px;font-family:inherit;font-size:14px;cursor:pointer}

/* Login Modal */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9500;display:flex;
  align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.2s;padding:20px}
.modal-ov.show{opacity:1;pointer-events:all}
.modal{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:24px;width:100%;max-width:320px;text-align:center}
.modal h3{font-size:17px;margin-bottom:6px}
.modal p{font-size:12px;color:var(--sub);margin-bottom:16px}
.modal input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;
  padding:11px 14px;color:var(--text);font-size:16px;text-align:center;letter-spacing:4px;
  font-family:'IBM Plex Mono',monospace;outline:none;margin-bottom:8px}
.modal input:focus{border-color:var(--p)}
.modal-err{font-size:11px;color:var(--red);min-height:16px;margin-bottom:8px}
.mbtn{width:100%;padding:11px;border-radius:8px;border:none;font-family:inherit;
  font-size:14px;font-weight:600;cursor:pointer;margin-top:4px}
.mbtn-p{background:var(--p);color:#fff}
.mbtn-g{background:var(--s2);color:var(--sub);border:1px solid var(--border)}

/* Detail Modal */
.detail-ov{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:8500;display:none;
  align-items:flex-end;justify-content:center;padding:0}
@media (min-width:540px){.detail-ov{align-items:center;padding:20px}}
.detail-ov.show{display:flex}
.detail{background:var(--s1);border:1px solid var(--border);border-radius:18px 18px 0 0;width:100%;max-width:480px;
  padding:24px 20px calc(24px + env(safe-area-inset-bottom));max-height:85vh;overflow-y:auto}
@media (min-width:540px){.detail{border-radius:18px}}
.dh{display:flex;justify-content:space-between;align-items:start;margin-bottom:16px}
.dh-l{display:flex;gap:12px;align-items:center;min-width:0;flex:1}
.dsw{width:48px;height:48px;border-radius:9px;border:1px solid rgba(255,255,255,.1);flex-shrink:0}
.dh-info{min-width:0;flex:1}
.dh-name{font-size:15px;font-weight:700;line-height:1.3}
.dh-meta{font-size:11px;color:var(--sub);font-family:'IBM Plex Mono',monospace;margin-top:4px}
.dh-close{background:var(--s2);border:1px solid var(--border);color:var(--sub);width:32px;height:32px;
  border-radius:50%;font-size:18px;cursor:pointer;flex-shrink:0}
.d-qty-box{background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:18px;
  display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.d-qty-l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.d-qty-v{font-size:36px;font-weight:700;font-family:'IBM Plex Mono',monospace;margin-top:4px}
.d-qty-ctrl{display:flex;gap:10px;align-items:center}
.d-qbtn{width:44px;height:44px;border-radius:10px;border:none;font-size:24px;font-weight:700;cursor:pointer}
.d-qbtn.plus{background:var(--green);color:#fff}
.d-qbtn.minus{background:var(--red);color:#fff}
.d-qbtn:disabled{opacity:.3}
.d-rows{display:grid;gap:8px}
.d-r{display:flex;justify-content:space-between;font-size:12px;padding:8px 12px;background:var(--s2);
  border-radius:8px;border:1px solid var(--border)}
.d-r .k{color:var(--muted)}.d-r .v{font-family:'IBM Plex Mono',monospace}

/* Toast */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--p);color:#fff;
  padding:10px 22px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;
  pointer-events:none;transition:.25s;z-index:9999;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.toast.ok{background:var(--green)}
.toast.err{background:var(--red)}
</style>
</head>

<div class="head">
  <div>
    <div class="logo">🍌 Stock 895</div>
    <div class="tagline" id="tagline">โหลด...</div>
  </div>

<!-- KPI -->
<div class="kpi-strip">

    <button class="abtn abtn-save" id="saveBtn" style="display:none" onclick="saveEdits()" disabled>💾 บันทึก (0)</button>
    <button class="abtn abtn-admin" id="adminBtn" onclick="toggleAdmin()">🔒 Admin</button>
  </div>
</div>

<!-- Scanner Modal -->
<div class="scan-overlay" id="scanOv">
  <h3>📷 สแกนบาร์โค้ดสินค้า</h3>
  <div id="reader"></div>
  <div class="scan-status" id="scanStatus">เล็งกล้องไปที่บาร์โค้ด...</div>
  <button class="scan-close" onclick="closeScanner()">✕ ปิด</button>
</div>

<!-- Login Modal -->
<div class="modal-ov" id="loginOv">
  <div class="modal">
    <div style="font-size:30px;margin-bottom:6px">🔐</div>
    <h3>Admin Login</h3>
    <p>ใส่รหัสเพื่อแก้ไขสต็อก</p>
    <input type="password" id="pwInput" placeholder="••••••" maxlength="20" onkeydown="if(event.key==='Enter')checkPw()">
    <div class="modal-err" id="pwErr"></div>
    <button class="mbtn mbtn-p" onclick="checkPw()">เข้าสู่ระบบ</button>
    <button class="mbtn mbtn-g" onclick="closeLogin()">ยกเลิก</button>
  </div>
</div>

<!-- Detail Modal -->
<div class="detail-ov" id="detailOv" onclick="if(event.target===this)closeDetail()">
  <div class="detail" id="detailBody"></div>
</div>

<div class="toast" id="toast"></div>

async function init(){
  try {
    const pSnap = await get(ref(db,'products'));
    PRODUCTS = pSnap.val() || {};
    if(Object.keys(PRODUCTS).length === 0){
      document.getElementById('container').innerHTML =
        `<div class="empty"><div class="ico">📭</div>ยังไม่มีข้อมูลสินค้าใน Firebase<br><br>
        <a href="./stock-uploader.html" style="color:var(--p2)">→ ไปที่หน้า Uploader</a><br>
        เพื่ออัปโหลด Excel ครั้งแรก</div>`;
    }

    // Subscribe to stock updates
    onValue(ref(db,'stock'), snap=>{
      const newStock = snap.val() || {};
      if(isAdmin){
        Object.keys(newStock).forEach(k=>{
          if(!(k in edits)) STOCK[k] = newStock[k];
        });
      } else {
        STOCK = newStock;
      }
      lastSyncAt = new Date();
      updateLastSyncDisplay();
      render();
    }, (err)=>{
      console.error('Stock listener error:', err);
      showErrorBanner('โหลดข้อมูล stock ล้มเหลว: ' + err.message);
    });

    // Show last sync info
    onValue(ref(db, 'sync_log'), snap=>{
      const v = snap.val() || {};
      const keys = Object.keys(v).sort();
      if(keys.length){
        const last = v[keys[keys.length-1]];
        const d = new Date(last.at);
        document.getElementById('bbLast').textContent =
          'Sync ล่าสุด ' + d.toLocaleString('th-TH',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
      }
    });

    // Mark app as successfully booted
    window.__appReady = true;

    // Hide scan button if library failed to load
    if(typeof window.Html5Qrcode === 'undefined'){
      const sb = document.querySelector('.scan-btn');
      if(sb){
        sb.style.opacity = '0.4';
        sb.title = 'Scanner library โหลดไม่ได้';
        sb.onclick = ()=>toast('สแกนใช้ไม่ได้ — library โหลดไม่สำเร็จ', 'err');
      }
    }
  } catch(err){
    console.error('Init error:', err);
    showErrorBanner('โหลดข้อมูลล้มเหลว: ' + (err.message || err) + '<br><small>ตรวจสอบ Firebase Rules และการเชื่อมต่อ</small>');
  }
}

// ── Render ────────────────────────────────────────────
function getList(){
  const q = document.getElementById('q').value.toLowerCase().trim();
  const items = [];
  for(const bc of Object.keys(PRODUCTS)){
    const p = PRODUCTS[bc];
    const qty = bc in edits ? edits[bc] : (STOCK[bc] ?? 0);
    items.push({barcode:bc, qty, ...p});
  }

  let filtered = items.filter(d=>{
    if(curFilter !== 'all'){
      if(curFilter.startsWith('cat:') && d.category !== curFilter.slice(4)) return false;
      if(curFilter.startsWith('brand:') && d.brand !== curFilter.slice(6)) return false;
      if(curFilter === 'low' && d.qty > 2) return false;
      if(curFilter === 'zero' && d.qty !== 0) return false;
    }
    if(q){
      const hay = (d.name+' '+d.barcode+' '+(d.brand||'')+' '+(d.model||'')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  // Sort
  filtered.sort((a,b)=>{
    if(curSort === 'qty') return b.qty - a.qty;
    if(curSort === 'price') return (b.set_price||0) - (a.set_price||0);
    return (a.name||'').localeCompare(b.name||'');
  });

  return filtered;
}

function render(){
  // KPIs
  const all = Object.keys(PRODUCTS).map(bc=>({
    bc, qty: bc in edits ? edits[bc] : (STOCK[bc] ?? 0)
  }));
  const totalSku = all.filter(d=>d.qty>0).length;
  const totalQty = all.reduce((s,d)=>s+d.qty,0);
  const lowQty = all.filter(d=>d.qty>0 && d.qty<=2).length;
  document.getElementById('kpiTotal').textContent = totalSku;
  document.getElementById('kpiQty').textContent = totalQty;
  document.getElementById('kpiLow').textContent = lowQty;
  document.getElementById('tagline').textContent =
    Object.keys(PRODUCTS).length + ' รายการ · ' + totalQty + ' ชิ้น';

  // Chips
  renderChips(all);

  // List
  const items = getList();
  const cont = document.getElementById('container');
  if(items.length === 0){
    cont.innerHTML = '<div class="empty"><div class="ico">🔍</div>ไม่พบสินค้า</div>';
    return;
  }

  if(curView === 'grid'){
    cont.innerHTML = '<div class="grid-wrap">' + items.map(d=>cardHtml(d)).join('') + '</div>';
  } else {
    cont.innerHTML = '<div class="list-wrap">' + items.map(d=>rowHtml(d)).join('') + '</div>';
  }
}

function renderChips(all){
  const counts = {all: all.reduce((s,d)=>s+d.qty,0)};
  const cats = {}, brands = {};
  let lowN = 0, zeroN = 0;
  for(const d of all){
    const p = PRODUCTS[d.bc];
    if(!p) continue;
    if(p.category){
      cats[p.category] = (cats[p.category]||0) + d.qty;
    }
    if(p.brand){
      brands[p.brand] = (brands[p.brand]||0) + d.qty;
    }
    if(d.qty>0 && d.qty<=2) lowN++;
    if(d.qty===0) zeroN++;
  }

  const chips = [
    {id:'all', label:'ทั้งหมด', n:counts.all},
    {id:'low', label:'⚠️ เหลือน้อย', n:lowN},
    ...Object.keys(cats).sort().map(c=>({id:'cat:'+c, label:c, n:cats[c]})),
    ...Object.keys(brands).filter(b=>!cats[b]).sort().map(b=>({id:'brand:'+b, label:b, n:brands[b]})),
  ];

  document.getElementById('chips').innerHTML = chips.map(c=>
    `<button class="chip ${curFilter===c.id?'on':''}" onclick="setFilter('${c.id}')">
      ${c.label}<span class="n">${c.n}</span></button>`
  ).join('');
}

  const fg = d.fg || (isLight(hex)?'111111':'F5F5F5');
  const swatchStyle = `background:#${hex};color:#${fg}`;
  const cls = d.qty===0 ? 'zero' : d.qty<=2 ? 'low' : 'ok';
  const editing = d.barcode in edits;
  return `<div class="row ${editing?'flash':''}" onclick="if(!event.target.closest('.qbtn'))showDetail('${d.barcode}')">
    <div class="sw" style="${swatchStyle}"></div>
    <div class="info">
      <div class="name">${escape(d.name)}</div>
      ${d.color ? `<div class="color-tag"><span class="cdot" style="background:#${hex}"></span>${escape(d.color||'')}</div>` : ''}
      <div class="meta">${d.barcode}</div>
      ${d.set_price ? `<div class="price">฿${fmt(d.set_price)}</div>` : ''}
    </div>
    <div class="qty-area">
      ${isAdmin ? `<button class="qbtn minus" onclick="event.stopPropagation();adj('${d.barcode}',-1)" ${d.qty<=0?'disabled':''}>−</button>` : ''}
      <div class="qty ${cls}">${d.qty}</div>
      ${isAdmin ? `<button class="qbtn plus" onclick="event.stopPropagation();adj('${d.barcode}',1)">+</button>` : ''}
    </div>
  </div>`;
}

function cardHtml(d){
  const hex = d.hex || guessHex(d.color, d.name) || '666666';
  const fg = d.fg || (isLight(hex)?'111111':'F5F5F5');

}

// ── Helpers ───────────────────────────────────────────
function fmt(n){ return Number(n).toLocaleString('th-TH'); }
function escape(s){ return String(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function isLight(hex){
  const r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
  return (0.299*r + 0.587*g + 0.114*b) > 145;
}
function guessHex(color, name){
  const c = (color||name||'').toLowerCase();
  const map = {
    black:'111111','space black':'1a1a1c','jet black':'050505','midnight':'1a1c2e',
    white:'f5f5f7','starlight':'fbf7eb','silver':'d0d0d2',
    blue:'2550a0','sky blue':'7eb6e0','ocean blue':'2c5a8c','mist blue':'9eb4cc','ultramarine':'4a7fc2','navy':'1e3a5f','teal':'4a8a8a','deep blue':'1e3a5a','sapphire blue':'2a4585','aurora blue':'4a7fb5','twilight blue':'2a4575','feather blue':'a8c5d8','authentic black':'111111',
    pink:'e8748a','rose gold':'d4a5a5','light blush':'e8b8b8','soft pink':'f0c5cc','sakura pink':'f5b8c5','afterglow pink':'f5a8b8',
    orange:'d4753a','cosmic orange':'d65a2a','blazing orange':'e85a25',
    gold:'d4a85a','aurora gold':'d4a85a','titanium gold':'b8a268','rose':'d4a5a5',
    purple:'7c3aed','plum purple':'7d4a8c','lavender purple':'a594c5','muse purple':'8a6db5','lavender':'b8a5d4',
    green:'5a8a5a','sage':'8aa58a','jade green':'4a8a6a',
    gray:'7c7c82','grey:':'7c7c82','space grey':'5a5a5e','titanium silver':'b8b8ba','titanium grey':'6a6a6e','glowing black':'1a1a1c','shadow black':'151515','marble white':'eeeae0','voyage black':'151515',
    brown:'7a5a3a','mocha brown':'7d553a','cappuccino brown':'8a6a52',
    yellow:'e8c34a',
    ice:'e0eaf0','ice white':'e8edf0','mist':'c8d0d8','mist titanium':'b0b8c0'
  };
  for(const k of Object.keys(map)){
    if(c.includes(k)) return map[k];
  }
  return '666666';
}

window.adj = (barcode, delta)=>{
  if(!isAdmin) return;
  const cur = barcode in edits ? edits[barcode] : (STOCK[barcode] ?? 0);
  const nv = Math.max(0, cur + delta);
  if(nv === (STOCK[barcode] ?? 0)){
    delete edits[barcode];
  } else {
    edits[barcode] = nv;
  }
  if(navigator.vibrate) navigator.vibrate(20);
  updateSaveBtn();
  render();
};
function updateSaveBtn(){
  const n = Object.keys(edits).length;

  b.textContent = `💾 บันทึก (${n})`;

}

let scanner = null;
window.openScanner = async ()=>{
  document.getElementById('scanOv').classList.add('show');
  document.getElementById('scanStatus').textContent = 'กำลังเปิดกล้อง...';
  document.getElementById('scanStatus').className = 'scan-status';

  try{
    if(typeof window.Html5Qrcode === 'undefined'){
      throw new Error('โหลด library กล้องไม่สำเร็จ ลอง refresh ใหม่');
    }
    if(!scanner) scanner = new window.Html5Qrcode("reader");
    // Format constants (numeric values from html5-qrcode lib).
    // We reference window.Html5QrcodeSupportedFormats if present, else use numeric fallback.
    const F = window.Html5QrcodeSupportedFormats || {
      QR_CODE:0, EAN_13:8, EAN_8:7, CODE_128:5, CODE_39:6, UPC_A:14, UPC_E:15
    };
    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: { width: 260, height: 130 },
        formatsToSupport: [
          F.EAN_13, F.EAN_8, F.CODE_128, F.CODE_39, F.UPC_A, F.UPC_E, F.QR_CODE
        ]
      },
      onScanSuccess,
      ()=>{} // silent on per-frame failure
    );
    document.getElementById('scanStatus').textContent = '🎯 เล็งกล้องไปที่บาร์โค้ด';
  } catch(err){
    document.getElementById('scanStatus').className = 'scan-status err';
    const msg = err && err.message ? err.message : String(err);
    document.getElementById('scanStatus').textContent = '❌ เปิดกล้องไม่ได้: ' + msg;
    console.error('Scanner error:', err);
  }
};
window.closeScanner = async ()=>{
  document.getElementById('scanOv').classList.remove('show');
  if(scanner){
    try{ await scanner.stop(); } catch(e){}
  }
};

async function onScanSuccess(decodedText){
  document.getElementById('scanStatus').className = 'scan-status found';
  document.getElementById('scanStatus').textContent = '✓ พบ: ' + decodedText;
  if(navigator.vibrate) navigator.vibrate([60,40,60]);

  // Try exact match first
  let bc = decodedText.trim();
  let found = PRODUCTS[bc];

  // If not found, try search by sub-string (in case barcode has prefix/suffix)
  if(!found){
    const matches = Object.keys(PRODUCTS).filter(k=>k.includes(bc) || bc.includes(k));
    if(matches.length === 1) { bc = matches[0]; found = PRODUCTS[bc]; }
  }

  await closeScanner();

  if(found){
    showDetail(bc);
    toast('🎯 ' + (found.name||bc), 'ok');
    // Flash effect
    setTimeout(()=>{
      const row = document.querySelector(`[onclick*="${bc}"]`);
      if(row) row.classList.add('flash');
    }, 100);
  } else {
    toast('❌ ไม่พบสินค้า: ' + bc, 'err');
    // Put in search box for manual check
    document.getElementById('q').value = bc;
